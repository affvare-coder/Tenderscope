name: Publish existing TenderScope Netlify site (no duplicate)
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tenderscope-existing-production-netlify
  cancel-in-progress: false

jobs:
  production:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      # Existing Netlify site UUID. Do not create or rename a project.
      NETLIFY_SITE_ID: ef2a51b5-ca33-4ba5-8592-8eae11d03008
    steps:
      - name: Netlify authorization gate
        if: env.NETLIFY_AUTH_TOKEN == ''
        run: |
          echo "::warning title=Netlify deploy blocked::Add NETLIFY_AUTH_TOKEN as an Actions repository secret, or link the EXISTING Netlify project to main. The separate packaging workflow builds the audited Drop release; production has NOT been published."
          echo "NETLIFY_DEPLOY_STATUS=BLOCKED_MISSING_TOKEN" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        if: env.NETLIFY_AUTH_TOKEN != ''
      - uses: actions/setup-node@v4
        if: env.NETLIFY_AUTH_TOKEN != ''
        with:
          node-version: '22'
          cache: npm
      - name: Test and build exact SHA
        if: env.NETLIFY_AUTH_TOKEN != ''
        run: |
          npm ci
          npm test
          npm run build
          test -f dist/index.html
          test -f netlify.toml
      - name: Publish to the EXISTING site
        if: env.NETLIFY_AUTH_TOKEN != ''
        run: |
          npx --yes netlify-cli@23.11.0 deploy \
            --prod \
            --dir=dist \
            --site="$NETLIFY_SITE_ID" \
            --auth="$NETLIFY_AUTH_TOKEN" \
            --message="TenderScope GitHub $GITHUB_SHA"
          echo "NETLIFY_DEPLOY_STATUS=DEPLOY_COMMAND_SUCCEEDED" >> "$GITHUB_ENV"
      - name: Report outcome
        run: |
          echo "## Existing TenderScope Netlify release" >> "$GITHUB_STEP_SUMMARY"
          echo "- Source SHA: \`$GITHUB_SHA\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Target site: \`$NETLIFY_SITE_ID\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Status: \`${NETLIFY_DEPLOY_STATUS:-UNKNOWN}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Production UI/browser QA must independently verify six Ask AI actions." >> "$GITHUB_STEP_SUMMARY"
