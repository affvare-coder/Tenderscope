name: TenderScope build, tests and Netlify release package
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Package verified Netlify Drop release with API proxy/auth headers
        run: |
          python3 scripts/package-drop.py
          python3 - <<'PY'
          import json, os, zipfile
          with zipfile.ZipFile('release/TenderScope_Public_Static.zip') as z:
              assert z.testzip() is None
              assert {'index.html','netlify.toml','document-studio.js','app.js','release.json'} <= set(z.namelist())
              config=z.read('netlify.toml').decode()
              assert 'publish = "."' in config and 'command = ""' in config
              assert '/api/public/*' in config and 'apikey' in config
              release=json.loads(z.read('release.json'))
              assert release['source_sha'] == os.environ['GITHUB_SHA'] and release['dirty'] is False
              studio=z.read('document-studio.js').decode()
              for action in ('Find matching OEMs','OEM contacts & email','Compliance & annexures','Clarification & representation'):
                  assert action in studio, f'Missing primary workflow: {action}'
          PY
      - name: Save audited existing-site Drop package
        uses: actions/upload-artifact@v4
        with:
          name: tenderscope-existing-site-netlify-drop
          path: release/TenderScope_Public_Static.zip
          retention-days: 14
