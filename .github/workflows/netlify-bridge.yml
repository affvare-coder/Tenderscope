name: Deploy TenderScope to Netlify

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: tenderscope-netlify-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Get GitHub OIDC token
        id: oidc
        uses: actions/github-script@v8
        with:
          script: |
            const token = await core.getIDToken('tenderscope-netlify-deploy')
            core.setSecret(token)
            core.setOutput('token', token)

      - name: Retrieve temporary Netlify deployment handoff
        id: handoff
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          JSON="$(curl -fsS -X POST             -H "Authorization: Bearer $OIDC_TOKEN"             -H "Content-Type: application/json"             https://agdmlgbfxoqhztiormij.supabase.co/functions/v1/tenderscope-netlify-handoff-temp)"
          PROXY_PATH="$(printf '%s' "$JSON" | python -c 'import sys,json; print(json.load(sys.stdin)["proxyPath"])')"
          echo "::add-mask::$PROXY_PATH"
          echo "proxy_path=$PROXY_PATH" >> "$GITHUB_OUTPUT"

      - name: Install MCP client
        shell: bash
        run: npm install --no-save @modelcontextprotocol/sdk@latest

      - name: Deploy existing Netlify production site
        env:
          PROXY_PATH: ${{ steps.handoff.outputs.proxy_path }}
          SITE_ID: ef2a51b5-ca33-4ba5-8592-8eae11d03008
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { Client } from "@modelcontextprotocol/sdk/client/index.js";
          import { StdioClientTransport } from "@modelcontextprotocol/sdk/client/stdio.js";

          const siteId = process.env.SITE_ID;
          const proxyPath = process.env.PROXY_PATH;
          const transport = new StdioClientTransport({
            command: "npx",
            args: ["-y", "@netlify/mcp@latest", "--site-id", siteId, "--proxy-path", proxyPath],
          });
          const client = new Client({ name: "tenderscope-netlify-ci", version: "1.0.0" });

          try {
            await client.connect(transport);
            const listed = await client.listTools();
            const deployTool =
              listed.tools.find(t => t.name === "netlify-deploy-services-updater") ||
              listed.tools.find(t => /deploy.*services.*updater/i.test(t.name)) ||
              listed.tools.find(t => /deploy-site/i.test(t.name));

            if (!deployTool) {
              throw new Error("Netlify deploy tool not found. Available: " + listed.tools.map(t => t.name).join(", "));
            }

            const args = /services.*updater/i.test(deployTool.name)
              ? { selectSchema: { operation: "deploy-site", params: { siteId } } }
              : { siteId };

            const result = await client.callTool({ name: deployTool.name, arguments: args });
            if (result.isError) {
              throw new Error("Netlify deploy returned an error: " + JSON.stringify(result.content));
            }
            console.log("Netlify deployment tool completed successfully.");
          } finally {
            await client.close();
          }
          NODE
