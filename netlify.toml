[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=60, must-revalidate"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=60, must-revalidate"

[[redirects]]
  from = "/api/public/*"
  to = "https://agdmlgbfxoqhztiormij.supabase.co/rest/v1/:splat"
  status = 200
  force = true
  [redirects.headers]
    apikey = "sb_publishable_8ZPkgNORB1X60ic5LaRWxw_EevahDkr"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
